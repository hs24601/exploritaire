<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' hero:; img-src hero:; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Desktop Hero</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; width: 100%; height: 100%; }
    canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; }
    body.over { cursor: grab; }
    body.held { cursor: grabbing; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script src="overlay.js"></script>
</body>
</html>
