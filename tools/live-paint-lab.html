<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exploritaire · Forest relief navigation</title></head><body><main id="forest-stage" aria-label="Single-source painted forest navigation"><canvas tabindex="0" aria-label="Forest viewport: WASD travel, Q/E altitude, drag orbit, right-drag pan, wheel zoom"></canvas><details><summary>Controls</summary><p>WASD travel · Q/E descend/rise · Shift faster. Left or middle drag orbits freely. Turn back rotates the view 180° in place. Right or Shift-drag pans. Wheel zooms. Touch: one finger pans, two pan/pinch, three orbit/tilt.</p></details><details id="fog-controls"><summary>Fog</summary><form id="fog-settings" aria-label="Dark fog controls"><label><input id="fog-enabled" type="checkbox" checked>Dark fog</label><label>Height <output id="fog-height-value">4 m</output><input id="fog-height" aria-label="Fog height" type="range" min="0" max="12" step="0.5" value="4"></label><label>Density <output id="fog-density-value">0.08</output><input id="fog-density" aria-label="Fog density" type="range" min="0" max="0.25" step="0.01" value="0.08"></label><label>Softness <output id="fog-softness-value">3 m</output><input id="fog-softness" aria-label="Fog softness" type="range" min="0.5" max="10" step="0.5" value="3"></label></form></details><output id="forest-readout">Loading forest…</output><div id="forest-pad" aria-label="Touch movement"><button type="button" data-key="w" aria-label="Move forward">↑</button><button type="button" data-key="a" aria-label="Move left">←</button><button type="button" data-key="s" aria-label="Move backward">↓</button><button type="button" data-key="d" aria-label="Move right">→</button><button type="button" data-key="q" aria-label="Descend">−</button><button type="button" data-key="e" aria-label="Rise">+</button></div><form id="forest-controls" aria-label="Forest camera controls"><button id="ground" type="button">Ground</button><button id="flight" type="button">Flight</button><button id="home" type="button">Home</button><button id="turn-back" type="button">Turn back</button><label>Depth <output id="depth-value">0.70</output><input id="depth" aria-label="Tree depth strength" type="range" min="0" max="1.5" step="0.05" value="0.7"></label><label>Trees <output id="density-value">120</output><input id="density" aria-label="Tree count" type="range" min="40" max="160" step="10" value="120"></label><label>Speed<input id="speed" aria-label="Camera movement speed" type="range" min="2" max="12" step="1" value="5"></label><label>Tree blend <output id="blend-value">1000 ms</output><input id="blend" aria-label="Object transition duration" type="range" min="0" max="3000" step="50" value="1000"></label><label><input id="upright" type="checkbox">Upright</label><label><input id="grid" type="checkbox">Grid</label></form><p id="forest-error" role="alert" hidden></p></main><script type="module" src="/src/tooling/forestLab.ts"></script></body></html>
